let indice = 0;

const vista = document.getElementById('vista-producto');
const aviso = document.getElementById('aviso-vacio-menu');
const foto = document.getElementById('foto-producto-actual');
const fotoBorrosa = document.getElementById('foto-fondo-borrosa');
const nombre = document.getElementById('nombre-producto-actual');
const especificaciones = document.getElementById('especificaciones-producto-actual');
const precio = document.getElementById('precio-producto-actual');

function mostrarActual() {
    if (productos.length === 0) {
        vista.hidden = true;
        aviso.hidden = false;
        return;
    }
    const p = productos[indice];
    nombre.textContent = p.nombre;
    especificaciones.textContent = p.especificaciones;
    especificaciones.hidden = !p.especificaciones;
    precio.textContent = p.precio;
    precio.hidden = !p.precio;

    if (p.foto) {
        foto.src = p.foto;
        foto.hidden = false;
        fotoBorrosa.src = p.foto;
        fotoBorrosa.hidden = false;
    } else {
        foto.hidden = true;
        fotoBorrosa.hidden = true;
    }
}

function siguiente() {
    if (productos.length === 0) return;
    indice = (indice + 1) % productos.length;
    mostrarActual();
}

mostrarActual();
setInterval(siguiente, 6000);
setTimeout(() => location.reload(), 5 * 60 * 1000);

const botonPantallaCompleta = document.getElementById('boton-pantalla-completa');
botonPantallaCompleta.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
});
document.addEventListener('fullscreenchange', () => {
    botonPantallaCompleta.hidden = !!document.fullscreenElement;
});
</script>
