<body class="pagina-menu-productos">

<div id="aviso-vacio-menu" class="aviso-vacio-menu" hidden>Todavía no hay productos para mostrar.</div>

        <p id="especificaciones-producto-actual" class="especificaciones-menu"></p>

</div>

<button id="boton-pantalla-completa" class="boton-pantalla-completa" type="button" autofocus>Pantalla completa</button>

<script>
const productos = [{"nombre":"Proteína Whey Isolate Rule1 Vainilla","especificaciones":"Proteína whey isolate Rule1, sabor Vainilla Créme, 25g de proteína por porción.","precio":"","foto":"img/productos/872bf6387ec5a2c0.jpg"},{"nombre":"Vitamina D3 Revive","especificaciones":"Vitamina D3 de Revive en cápsulas vegetarianas, para inmunidad y salud ósea.","precio":"","foto":"img/productos/04aac0e0b2071e84.jpg"},{"nombre":"Proteína ProLive Bio6 Sundae Caramel","especificaciones":"Proteína whey isolate-hidrolizada Impulse ProLive Bio6, sabor Sundae Caramel, con probióticos.","precio":"","foto":"img/productos/8cdd2f468df55b59.jpg"},{"nombre":"Proteína EvoFusion Chocolate Peanut Butter","especificaciones":"Proteína EvoFusion de Evogen, sabor Chocolate Peanut Butter, para crecimiento y recuperación muscular.","precio":"","foto":"img/productos/e997b8ce12f9b71a.jpg"},{"nombre":"Prostate Support NOW","especificaciones":"Prostate Support de NOW, con saw palmetto, ortiga y licopeno, en softgels.","precio":"","foto":"img/productos/77394ee4d8d9f8e2.jpg"},{"nombre":"HMB 1000mg NOW Sports","especificaciones":"HMB Doble Concentración de NOW Sports con vitamina D3, para recuperación deportiva.","precio":"","foto":"img/productos/b31d70ae74a29905.jpg"},{"nombre":"Proteína Vegana Vegan Ultra Strawberry","especificaciones":"Proteína vegana Vegan Ultra de Impulse, sabor Strawberry Ice Cream, 22g de proteína por porción.","precio":"","foto":"img/productos/eefadec74be7df4d.jpg"},{"nombre":"Cardo Mariano Life Extension","especificaciones":"Cardo Mariano Avanzado de Life Extension, en softgels, para apoyo hepático.","precio":"","foto":"img/productos/bccc66312073c87b.jpg"},{"nombre":"Proteína Itholate RAW x BUM Birthday Cake","especificaciones":"Proteína Itholate de RAW x BUM, sabor Birthday Cake, 25g de proteína por porción.","precio":"","foto":"img/productos/20d6808e107c0caf.jpg"},{"nombre":"Proteína Carnivor Beef MuscleMeds Chocolate","especificaciones":"Proteína de carne hidrolizada Carnivor de MuscleMeds, sabor Chocolate, cero grasa y azúcar.","precio":"","foto":"img/productos/7f7fde3e43836163.jpg"},{"nombre":"Multivitamínico Revive + SAMe Life Extension","especificaciones":"Multivitamínico Revive junto con SAMe de Life Extension, para bienestar general y salud articular.","precio":"","foto":"img/productos/2f15773c5f5b1f69.jpg"},{"nombre":"L-Carnitina Líquida 3000 Fruit Punch","especificaciones":"L-Carnitina 3000 líquida, sabor Fruit Punch, bombeo metabólico sin estimulantes.","precio":"","foto":"img/productos/57c19556fdaa977e.jpg"},{"nombre":"Vendas de Boxeo Everlast","especificaciones":"Vendas de boxeo Everlast Choice of Champions, para proteger manos y muñecas al entrenar.","precio":"","foto":"img/productos/8af2fa375fbb168c.jpg"},{"nombre":"Mancuernas 3lb (Par)","especificaciones":"Par de mancuernas de 3 libras, ideales para tonificación y ejercicios de bajo impacto.","precio":"","foto":"img/productos/4550b45d21b1ef63.jpg"},{"nombre":"Tobillera Elástica Everlast XL","especificaciones":"Tobillera elástica Everlast talla XL, brinda soporte y compresión para evitar esguinces.","precio":"","foto":"img/productos/adfd5a3c52b00572.jpg"},{"nombre":"Rodillera de Neopreno Everlast M","especificaciones":"Rodillera básica de neopreno Everlast talla M, compresión y soporte para la rodilla.","precio":"","foto":"img/productos/b7a5395f8c441bcf.jpg"},{"nombre":"Shaker ABE All Black Everything","especificaciones":"Shaker ABE All Black Everything, para preparar batidos de proteína o pre-entreno.","precio":"","foto":"img/productos/7bccf7ca90fe7514.jpg"},{"nombre":"RAW Pump Non-Stim Piña","especificaciones":"RAW Pump Non-Stim, sabor Piña, bombeo muscular sin estimulantes.","precio":"","foto":"img/productos/ce56facbbe315292.jpg"},{"nombre":"Kettlebells Everlast 5lb y 8lb","especificaciones":"Kettlebells Everlast de 5 y 8 libras, para entrenamiento funcional de fuerza.","precio":"","foto":"img/productos/ae91fa305cc6a0df.jpg"},{"nombre":"Anadrox Pump & Burn MHP","especificaciones":"Anadrox Pump & Burn de MHP, cápsulas termogénicas con óxido nítrico.","precio":"","foto":"img/productos/5e543b9a36807121.jpg"},{"nombre":"Rodillera Elástica Everlast L","especificaciones":"Rodillera elástica Everlast talla L, compresión y soporte para la rodilla.","precio":"","foto":"img/productos/d2ed3e3302821b56.jpg"},{"nombre":"Pre-Entreno Thavage RAW x BUM Green Crush","especificaciones":"Pre-entreno Thavage de RAW x BUM, sabor Green Crush, 40 porciones.","precio":"","foto":"img/productos/08b14f1e17c12045.jpg"}];
let indice = 0;

const vista = document.getElementById('vista-producto');
const aviso = document.getElementById('aviso-vacio-menu');
const foto = document.getElementById('foto-producto-actual');
const fotoBorrosa = document.getElementById('foto-fondo-borrosa');
const nombre = document.getElementById('nombre-producto-actual');
const especificaciones = document.getElementById('especificaciones-producto-actual');
const precio = document.getElementById('precio-producto-actual');

function mostrarActual() {
    if (productos.length === 0) {
        vista.hidden = true;
        aviso.hidden = false;
        return;
    }
    const p = productos[indice];
    nombre.textContent = p.nombre;
    especificaciones.textContent = p.especificaciones;
    especificaciones.hidden = !p.especificaciones;
    precio.textContent = p.precio;
    precio.hidden = !p.precio;

    if (p.foto) {
        foto.src = p.foto;
        foto.hidden = false;
        fotoBorrosa.src = p.foto;
        fotoBorrosa.hidden = false;
    } else {
        foto.hidden = true;
        fotoBorrosa.hidden = true;
    }
}

function siguiente() {
    if (productos.length === 0) return;
    indice = (indice + 1) % productos.length;
    mostrarActual();
}

mostrarActual();
setInterval(siguiente, 6000);
setTimeout(() => location.reload(), 5 * 60 * 1000);

const botonPantallaCompleta = document.getElementById('boton-pantalla-completa');
botonPantallaCompleta.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
});
document.addEventListener('fullscreenchange', () => {
    botonPantallaCompleta.hidden = !!document.fullscreenElement;
});
</script>
</body>
</html>
